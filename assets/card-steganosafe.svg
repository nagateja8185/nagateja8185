<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 174" width="100%" height="100%" style="border-radius: 10px; overflow: hidden; background: #10070C;">
  <defs>
    <radialGradient id="card-glow-steganosafe" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#190B12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="1"/>
    </radialGradient>
    <pattern id="card-grid-steganosafe" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#451126" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
    <filter id="card-blur-steganosafe" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .tng-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .tng-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Surface Base -->
  <rect width="100%" height="100%" fill="#10070C"/>
  <rect width="100%" height="100%" fill="url(#card-glow-steganosafe)"/>
  <rect width="100%" height="100%" fill="url(#card-grid-steganosafe)"/>

  <!-- Left Indicator Pillar -->
  <rect x="0" y="0" width="4" height="174" fill="#E5B5C7"/>

  <!-- Icon Container -->
  <g transform="translate(24, 24)">
    <rect width="44" height="44" rx="8" fill="#190B12" stroke="#701A3D" stroke-width="1.2"/>
    <g transform="translate(6, 6) scale(0.9)" stroke="#E5B5C7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 8 14 L 8 10 C 8 5.6 11.6 2 16 2 C 20.4 2 24 5.6 24 10 L 24 14 M 6 14 L 26 14 C 27.1 14 28 14.9 28 16 L 28 30 C 28 31.1 27.1 32 26 32 L 6 32 C 4.9 32 4 31.1 4 30 L 4 16 C 4 14.9 4.9 14 6 14 Z"/>
    </g>
  </g>

  <!-- Title & Metadata -->
  <g transform="translate(82, 28)">
    <text x="0" y="11" fill="#E5B5C7" class="tng-mono" font-size="9" font-weight="600" letter-spacing="1.8">
      APPLIED CRYPTOGRAPHY &amp; STEGANOGRAPHY
    </text>
    <text x="0" y="31" fill="#F8F0F3" class="tng-sans" font-size="16.5" font-weight="700" letter-spacing="0.4">
      SteganoSafe — Multi-Tier Secure File Sharing
    </text>
  </g>

  <!-- Right Badge -->
  <g transform="translate(900, 32)">
    <rect x="-190" y="0" width="190" height="24" rx="4" fill="#190B12" stroke="#701A3D" stroke-width="1"/>
    <circle cx="-178" cy="12" r="3" fill="#E5B5C7"/>
    <text x="-90" y="15.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="600" letter-spacing="0.8" text-anchor="middle">
      AES-256-GCM + HYBRID LSB
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="82" y1="72" x2="896" y2="72" stroke="#451126" stroke-width="0.8" stroke-opacity="0.8"/>

  <!-- Description Body -->
  <g transform="translate(82, 94)">
    <text x="0" y="0" fill="#E5B5C7" class="tng-sans" font-size="12.5" font-weight="400" letter-spacing="0.2">
      Production-style zero-knowledge file concealment platform embedding payloads up to 50MB.
    </text>
    <text x="0" y="18" fill="#C77B9B" class="tng-sans" font-size="12" font-weight="400" letter-spacing="0.2" opacity="0.9">
      Combines AES-256-GCM encryption with hybrid LSB / IEND steganography, PBKDF2 (100k rounds) &amp; RBAC.
    </text>
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(82, 134)">
    <g transform="translate(0, 0)">
          <rect width="61.2" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="30.6" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">Python</text>
        </g>
    <g transform="translate(69.2, 0)">
          <rect width="97.2" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="48.6" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">AES-256-GCM</text>
        </g>
    <g transform="translate(174.4, 0)">
          <rect width="111.6" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="55.8" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">Steganography</text>
        </g>
    <g transform="translate(294.0, 0)">
          <rect width="111.6" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="55.8" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">PBKDF2-SHA256</text>
        </g>
    <g transform="translate(413.6, 0)">
          <rect width="111.6" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="55.8" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">Audit Logging</text>
        </g>
    <g transform="translate(533.2, 0)">
          <rect width="104.4" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="52.2" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">Session Auth</text>
        </g>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="919" height="173" rx="9.5" fill="none" stroke="#451126" stroke-width="1"/>
</svg>