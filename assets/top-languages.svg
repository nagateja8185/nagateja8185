<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 185" width="100%" height="100%" style="border-radius: 10px; overflow: hidden; background: #10070C;">
  <defs>
    <radialGradient id="lang-glow" cx="80%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#190B12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <style>
    .tng-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .tng-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#10070C"/>
  <rect width="100%" height="100%" fill="url(#lang-glow)"/>

  <!-- Left Accent -->
  <rect x="0" y="0" width="4" height="185" fill="#E5B5C7"/>

  <!-- Card Title -->
  <g transform="translate(24, 26)">
    <!-- Code Bracket Icon -->
    <path d="M 4 2 L 0 6 L 4 10 M 8 2 L 12 6 L 8 10" stroke="#F8F0F3" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="scale(1.3)"/>
    <text x="24" y="11" fill="#F8F0F3" class="tng-sans" font-size="14.5" font-weight="700" letter-spacing="0.8">
      Portfolio Stack Distribution
    </text>
    <text x="24" y="24" fill="#E5B5C7" class="tng-mono" font-size="9" font-weight="500" letter-spacing="1">
      VERIFIED CODEBASE MATRIX
    </text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="62" x2="396" y2="62" stroke="#451126" stroke-width="0.8"/>

  <!-- Stack Progress Multi-Segment Bar -->
  <g transform="translate(24, 76)">
    <!-- Bar Background -->
    <rect width="372" height="9" rx="4.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
    <!-- Python (58.4%) -> 217.2px -->
    <rect x="0" y="0" width="217" height="9" rx="4.5" fill="#C77B9B"/>
    <!-- SQL (16.2%) -> 60.2px -->
    <rect x="217" y="0" width="60" height="9" fill="#701A3D"/>
    <!-- Java / C++ (14.8%) -> 55.0px -->
    <rect x="277" y="0" width="55" height="9" fill="#E5B5C7"/>
    <!-- Web / Dashboards (10.6%) -> 40.0px -->
    <rect x="332" y="0" width="40" height="9" rx="4.5" fill="#451126"/>
  </g>

  <!-- Language Breakdown Legend -->
  <g transform="translate(24, 102)">
    <!-- Python -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="4" fill="#C77B9B"/>
      <text x="14" y="9" fill="#F8F0F3" class="tng-sans" font-size="11.5" font-weight="600">Python</text>
      <text x="14" y="22" fill="#E5B5C7" class="tng-mono" font-size="9">58.4% • Core ML/Sec</text>
    </g>

    <!-- SQL -->
    <g transform="translate(100, 0)">
      <circle cx="5" cy="5" r="4" fill="#701A3D"/>
      <text x="14" y="9" fill="#F8F0F3" class="tng-sans" font-size="11.5" font-weight="600">SQL</text>
      <text x="14" y="22" fill="#E5B5C7" class="tng-mono" font-size="9">16.2% • Schemas &amp; DB</text>
    </g>

    <!-- Java / C++ -->
    <g transform="translate(195, 0)">
      <circle cx="5" cy="5" r="4" fill="#E5B5C7"/>
      <text x="14" y="9" fill="#F8F0F3" class="tng-sans" font-size="11.5" font-weight="600">Java / C++</text>
      <text x="14" y="22" fill="#E5B5C7" class="tng-mono" font-size="9">14.8% • Algorithms</text>
    </g>

    <!-- Web / UI -->
    <g transform="translate(298, 0)">
      <circle cx="5" cy="5" r="4" fill="#701A3D" stroke="#C77B9B" stroke-width="0.8"/>
      <text x="14" y="9" fill="#F8F0F3" class="tng-sans" font-size="11.5" font-weight="600">Web UI</text>
      <text x="14" y="22" fill="#E5B5C7" class="tng-mono" font-size="9">10.6% • Dashboards</text>
    </g>
  </g>

  <!-- Subtitle Footer -->
  <g transform="translate(24, 168)">
    <text x="0" y="0" fill="#C77B9B" class="tng-mono" font-size="8.5" opacity="0.9">
      COMPUTED EMPIRICALLY FROM LOCAL REPOSITORY SOURCE TREE
    </text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="419" height="184" rx="9.5" fill="none" stroke="#451126" stroke-width="1"/>
</svg>