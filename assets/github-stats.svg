    .tng-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#10070C"/>
  <rect width="100%" height="100%" fill="url(#stats-glow)"/>

  <!-- Left Accent -->
  <rect x="0" y="0" width="4" height="185" fill="#C77B9B"/>

  <!-- Card Title -->
  <g transform="translate(24, 26)">
    <!-- GitHub Icon Silhouette -->
    <path d="M 0 6 C 0 2.7 2.7 0 6 0 C 9.3 0 12 2.7 12 6 C 12 8.7 10.3 10.9 7.8 11.7 C 7.5 11.8 7.4 11.6 7.4 11.4 L 7.4 9.9 C 7.4 9.3 7.2 9 7 8.8 C 8.3 8.7 9.8 8.1 9.8 5.7 C 9.8 5.1 9.6 4.5 9.2 4.1 C 9.3 3.9 9.5 3.3 9.1 2.5 C 9.1 2.5 8.6 2.3 7.4 3.1 C 7 3 6.5 2.9 6 2.9 C 5.5 2.9 5 3 4.6 3.1 C 3.4 2.3 2.9 2.5 2.9 2.5 C 2.5 3.3 2.7 3.9 2.8 4.1 C 2.4 4.5 2.2 5.1 2.2 5.7 C 2.2 8.1 3.7 8.7 5 8.8 C 4.8 9 4.6 9.3 4.6 9.7 C 4.1 9.9 3 10.3 2.3 9 C 2.3 9 1.8 8.1 1.1 8 C 1.1 8 0.4 7.9 1 8.5 C 1 8.5 1.5 8.7 1.9 9.6 C 1.9 9.6 2.3 10.8 3.5 10.5 L 3.5 11.4 C 3.5 11.6 3.4 11.8 3.1 11.7 C 1.6 10.9 0 8.7 0 6 Z"
          fill="#F8F0F3" transform="scale(1.3)"/>
    <text x="24" y="11" fill="#F8F0F3" class="tng-sans" font-size="14.5" font-weight="700" letter-spacing="0.8">
      GitHub Profile Telemetry
    </text>
    <text x="24" y="24" fill="#C77B9B" class="tng-mono" font-size="9" font-weight="500" letter-spacing="1">
      USER: @nagateja8185
    </text>
  </g>

  <!-- Divider -->
  <line x1="24" y1="62" x2="396" y2="62" stroke="#451126" stroke-width="0.8"/>

  <!-- Stats Rows -->
  <g transform="translate(24, 76)">
    <!-- Row 1: Specialization -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="9" r="2.5" fill="#C77B9B"/>
      <text x="14" y="13" fill="#E5B5C7" class="tng-mono" font-size="10.5">Specialization:</text>
      <text x="372" y="13" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600" text-anchor="end">Information Security &amp; AI</text>
    </g>

    <!-- Row 2: Core Engineering Systems -->
    <g transform="translate(0, 26)">
      <circle cx="4" cy="9" r="2.5" fill="#E5B5C7"/>
      <text x="14" y="13" fill="#E5B5C7" class="tng-mono" font-size="10.5">Featured Systems:</text>
      <text x="372" y="13" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600" text-anchor="end">5 Flagship Repositories</text>
    </g>

    <!-- Row 3: Security & Cryptography -->
    <g transform="translate(0, 52)">
      <circle cx="4" cy="9" r="2.5" fill="#C77B9B"/>
      <text x="14" y="13" fill="#E5B5C7" class="tng-mono" font-size="10.5">Cryptographic Suite:</text>
      <text x="372" y="13" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600" text-anchor="end">AES-256-GCM • LSB Steg</text>
    </g>

    <!-- Row 4: Academic Standing -->
    <g transform="translate(0, 78)">
      <circle cx="4" cy="9" r="2.5" fill="#E5B5C7"/>
      <text x="14" y="13" fill="#E5B5C7" class="tng-mono" font-size="10.5">Academic Standing:</text>
      <text x="372" y="13" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600" text-anchor="end">VIT Vellore (CGPA 7.96)</text>
    </g>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="419" height="184" rx="9.5" fill="none" stroke="#451126" stroke-width="1"/>
</svg>