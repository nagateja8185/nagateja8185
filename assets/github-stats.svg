<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 185" width="100%" height="100%" style="border-radius: 10px; overflow: hidden; background: #10070C;">
  <defs>
    <radialGradient id="stats-glow" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#190B12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <style>
