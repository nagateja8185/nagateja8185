<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 62" width="100%" height="100%" style="border-radius: 8px; overflow: hidden; background: #10070C;">
  <defs>
    <linearGradient id="sec-grad-experience" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#190B12" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="sec-line-experience" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#701A3D" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .tng-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .tng-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="#10070C"/>
  <rect width="100%" height="100%" fill="url(#sec-grad-experience)"/>

  <!-- Left Accent Vertical Pillar -->
  <rect x="0" y="0" width="5" height="62" fill="#C77B9B"/>
  <rect x="5" y="0" width="1" height="62" fill="#701A3D" opacity="0.6"/>

  <!-- Corner tech ticks -->
  <path d="M 16 12 L 24 12" stroke="#701A3D" stroke-width="1" fill="none"/>
  <path d="M 944 12 L 936 12" stroke="#701A3D" stroke-width="1" fill="none"/>
  <path d="M 944 50 L 936 50" stroke="#701A3D" stroke-width="1" fill="none"/>

  <!-- Left Content Group -->
  <g transform="translate(32, 22)">
    <!-- Small glyph indicator -->
    <rect x="0" y="4" width="8" height="8" rx="1.5" fill="#C77B9B" opacity="0.9"/>
    <circle cx="4" cy="8" r="1.5" fill="#10070C"/>

    <!-- Section Title -->
    <text x="18" y="12" fill="#F8F0F3" class="tng-sans" font-size="14.5" font-weight="700" letter-spacing="1.5">
      03 // INDUSTRY EXPERIENCE &amp; RESEARCH
    </text>

    <!-- Subtitle -->
    <text x="18" y="26" fill="#C77B9B" class="tng-mono" font-size="9.5" font-weight="500" letter-spacing="1.8" opacity="0.9">
      AI/ML INTERNSHIP @ EDUFYI TECH SOLUTIONS
    </text>
  </g>

  <!-- Center-Right Flowing Trace -->
  <line x1="560" y1="36" x2="790" y2="36" stroke="url(#sec-line-experience)" stroke-width="1.2" stroke-dasharray="8 4"/>

  <!-- Right Code Block -->
  <g transform="translate(928, 35)">
    <rect x="-124" y="-14" width="124" height="23" rx="4" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="-62" y="1.5" fill="#E5B5C7" class="tng-mono" font-size="9.5" font-weight="600" letter-spacing="1.2" text-anchor="middle">
      SYS.03 // EXPR
    </text>
  </g>

  <!-- Bottom Border -->
  <line x1="0" y1="61" x2="960" y2="61" stroke="#451126" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="959" height="61" rx="7.5" fill="none" stroke="#451126" stroke-width="1" stroke-opacity="0.6"/>
</svg>