<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="100%" height="100%" style="border-radius: 10px; overflow: hidden; background: #10070C;">
  <defs>
    <radialGradient id="act-glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#190B12" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="1"/>
    </radialGradient>
    <pattern id="act-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#451126" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <style>
    .tng-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .tng-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Surface Base -->
  <rect width="100%" height="100%" fill="#10070C"/>
  <rect width="100%" height="100%" fill="url(#act-glow)"/>
  <rect width="100%" height="100%" fill="url(#act-grid)"/>

  <!-- Top Title Bar -->
  <g transform="translate(24, 24)">
    <circle cx="4" cy="5" r="3.5" fill="#C77B9B"/>
    <text x="16" y="9" fill="#F8F0F3" class="tng-sans" font-size="12" font-weight="700" letter-spacing="1.2">
      ENGINEERING PIPELINE ARCHITECTURE // CYBER DEFENSE &amp; MACHINE LEARNING WORKFLOW
    </text>
    <text x="872" y="9" fill="#E5B5C7" class="tng-mono" font-size="8.5" font-weight="500" letter-spacing="1" text-anchor="end">
      [SYSTEM ARCHITECTURE REFERENCE]
    </text>
  </g>

  <!-- Flowchart Steps -->
  <!-- Node 1: Ingestion -->
  <g transform="translate(24, 52)">
    <rect width="195" height="114" rx="6" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <rect x="0" y="0" width="195" height="22" rx="6" fill="#451126" fill-opacity="0.5"/>
    <text x="12" y="15" fill="#E5B5C7" class="tng-mono" font-size="9" font-weight="600" letter-spacing="1">01 // INGESTION</text>
    <text x="12" y="42" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Network Log Telemetry</text>
    <text x="12" y="60" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• URLs &amp; Email Content</text>
    <text x="12" y="78" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Encrypted Files (50MB)</text>
    <text x="12" y="96" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Clinical Diagnostic Inputs</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g stroke="#C77B9B" stroke-width="1.2" fill="none" opacity="0.7">
    <line x1="225" y1="109" x2="249" y2="109"/>
    <path d="M 245 105 L 249 109 L 245 113"/>
  </g>

  <!-- Node 2: Transformation -->
  <g transform="translate(255, 52)">
    <rect width="195" height="114" rx="6" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <rect x="0" y="0" width="195" height="22" rx="6" fill="#451126" fill-opacity="0.5"/>
    <text x="12" y="15" fill="#E5B5C7" class="tng-mono" font-size="9" font-weight="600" letter-spacing="1">02 // PROCESSING</text>
    <text x="12" y="42" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• TF-IDF Vectorization</text>
    <text x="12" y="60" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• 20+ URL Lexical Features</text>
    <text x="12" y="78" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• PBKDF2 Key Derivation</text>
    <text x="12" y="96" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Feature Scaling &amp; EDA</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g stroke="#C77B9B" stroke-width="1.2" fill="none" opacity="0.7">
    <line x1="456" y1="109" x2="480" y2="109"/>
    <path d="M 476 105 L 480 109 L 476 113"/>
  </g>

  <!-- Node 3: Core Intelligence -->
  <g transform="translate(486, 52)">
    <rect width="195" height="114" rx="6" fill="#190B12" stroke="#701A3D" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="22" rx="6" fill="#701A3D" fill-opacity="0.5"/>
    <text x="12" y="15" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="600" letter-spacing="1">03 // DEFENSE CORE</text>
    <text x="12" y="42" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Random Forest &amp; Logistic</text>
    <text x="12" y="60" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• AES-256-GCM + LSB Stg</text>
    <text x="12" y="78" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• 95th-P Volume Spikes</text>
    <text x="12" y="96" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Decision Trees Classifier</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g stroke="#C77B9B" stroke-width="1.2" fill="none" opacity="0.7">
    <line x1="687" y1="109" x2="711" y2="109"/>
    <path d="M 707 105 L 711 109 L 707 113"/>
  </g>

  <!-- Node 4: Output Verification -->
  <g transform="translate(717, 52)">
    <rect width="179" height="114" rx="6" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <rect x="0" y="0" width="179" height="22" rx="6" fill="#451126" fill-opacity="0.5"/>
    <text x="12" y="15" fill="#E5B5C7" class="tng-mono" font-size="9" font-weight="600" letter-spacing="1">04 // OUTCOME</text>
    <text x="12" y="42" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• 95-96% Threat Accuracy</text>
    <text x="12" y="60" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Tamper-Proof Stego Carrier</text>
    <text x="12" y="78" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Real-Time Visual Alerts</text>
    <text x="12" y="96" fill="#F8F0F3" class="tng-sans" font-size="11" font-weight="600">• Validated F1 &amp; Precision</text>
  </g>

  <!-- Footer Annotation -->
  <g transform="translate(24, 185)">
    <text x="0" y="0" fill="#C77B9B" class="tng-mono" font-size="8.5" letter-spacing="0.8">
      STATUS: EMPIRICALLY BENCHMARKED • VERIFIED AGAINST LOCAL REPOSITORIES &amp; RESUME
    </text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="919" height="199" rx="9.5" fill="none" stroke="#451126" stroke-width="1"/>
</svg>