<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 174" width="100%" height="100%" style="border-radius: 10px; overflow: hidden; background: #10070C;">
  <defs>
    <radialGradient id="card-glow-phishshield" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#190B12" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="1"/>
    </radialGradient>
    <pattern id="card-grid-phishshield" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#451126" stroke-width="0.5" stroke-opacity="0.35"/>
    </pattern>
    <filter id="card-blur-phishshield" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .tng-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
    .tng-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Surface Base -->
  <rect width="100%" height="100%" fill="#10070C"/>
  <rect width="100%" height="100%" fill="url(#card-glow-phishshield)"/>
  <rect width="100%" height="100%" fill="url(#card-grid-phishshield)"/>

  <!-- Left Indicator Pillar -->
  <rect x="0" y="0" width="4" height="174" fill="#C77B9B"/>

  <!-- Icon Container -->
  <g transform="translate(24, 24)">
    <rect width="44" height="44" rx="8" fill="#190B12" stroke="#701A3D" stroke-width="1.2"/>
    <g transform="translate(6, 6) scale(0.9)" stroke="#C77B9B" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 16 6 L 4 12 L 4 20 C 4 27 16 34 16 34 C 16 34 28 27 28 20 L 28 12 Z"/>
    </g>
  </g>

  <!-- Title & Metadata -->
  <g transform="translate(82, 28)">
    <text x="0" y="11" fill="#C77B9B" class="tng-mono" font-size="9" font-weight="600" letter-spacing="1.8">
      CYBERSECURITY &amp; THREAT INTELLIGENCE
    </text>
    <text x="0" y="31" fill="#F8F0F3" class="tng-sans" font-size="16.5" font-weight="700" letter-spacing="0.4">
      PhishShield — AI-Powered Phishing Threat Detection
    </text>
  </g>

  <!-- Right Badge -->
  <g transform="translate(900, 32)">
    <rect x="-190" y="0" width="190" height="24" rx="4" fill="#190B12" stroke="#701A3D" stroke-width="1"/>
    <circle cx="-178" cy="12" r="3" fill="#C77B9B"/>
    <text x="-90" y="15.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="600" letter-spacing="0.8" text-anchor="middle">
      ACCURACY: 95-96%
    </text>
  </g>

  <!-- Divider Line -->
  <line x1="82" y1="72" x2="896" y2="72" stroke="#451126" stroke-width="0.8" stroke-opacity="0.8"/>

  <!-- Description Body -->
  <g transform="translate(82, 94)">
    <text x="0" y="0" fill="#E5B5C7" class="tng-sans" font-size="12.5" font-weight="400" letter-spacing="0.2">
      Multi-layered threat classification engine analyzing emails, URLs, and web hosts.
    </text>
    <text x="0" y="18" fill="#C77B9B" class="tng-sans" font-size="12" font-weight="400" letter-spacing="0.2" opacity="0.9">
      Engineered with TF-IDF NLP vectorization, Random Forest classifier, and 20+ lexical URL features.
    </text>
  </g>

  <!-- Tech Stack Chips -->
  <g transform="translate(82, 134)">
    <g transform="translate(0, 0)">
          <rect width="61.2" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="30.6" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">Python</text>
        </g>
    <g transform="translate(69.2, 0)">
          <rect width="104.4" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="52.2" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">Scikit-Learn</text>
        </g>
    <g transform="translate(181.60000000000002, 0)">
          <rect width="104.4" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="52.2" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">NLP / TF-IDF</text>
        </g>
    <g transform="translate(294.0, 0)">
          <rect width="111.6" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="55.8" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">Random Forest</text>
        </g>
    <g transform="translate(413.6, 0)">
          <rect width="75.6" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="37.8" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">REST API</text>
        </g>
    <g transform="translate(497.20000000000005, 0)">
          <rect width="147.6" height="20" rx="3.5" fill="#190B12" stroke="#451126" stroke-width="0.8"/>
          <text x="73.8" y="13.5" fill="#F8F0F3" class="tng-mono" font-size="9" font-weight="500" letter-spacing="0.5" text-anchor="middle">WHOIS Intelligence</text>
        </g>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="919" height="173" rx="9.5" fill="none" stroke="#451126" stroke-width="1"/>
</svg>