<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 90" width="100%" height="100%" style="border-radius: 10px; overflow: hidden; background: #10070C;">
  <defs>
    <radialGradient id="tng-ft-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#190B12" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="tng-ft-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="0.1; 0.7; 0.1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="1">
        <animate attributeName="offset" values="0.2; 0.8; 0.2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="70%" stop-color="#C77B9B" stop-opacity="0.8">
        <animate attributeName="offset" values="0.3; 0.9; 0.3" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#701A3D" stop-opacity="0"/>
    </linearGradient>

    <filter id="tng-ft-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .tng-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Menlo, Consolas, monospace; }
  </style>

  <!-- Base Background -->
  <rect width="100%" height="100%" fill="#10070C"/>
  <rect width="100%" height="100%" fill="url(#tng-ft-glow)"/>

  <!-- Top Accent Beam -->
  <line x1="40" y1="1" x2="920" y2="1" stroke="#451126" stroke-width="1"/>
  <line x1="40" y1="1" x2="920" y2="1" stroke="url(#tng-ft-line)" stroke-width="2" filter="url(#tng-ft-filter)"/>

  <!-- Technical Corner Accents -->
  <path d="M 16 24 L 16 12 L 28 12" fill="none" stroke="#701A3D" stroke-width="1"/>
  <path d="M 944 24 L 944 12 L 932 12" fill="none" stroke="#701A3D" stroke-width="1"/>
  <path d="M 16 66 L 16 78 L 28 78" fill="none" stroke="#701A3D" stroke-width="1"/>
  <path d="M 944 66 L 944 78 L 932 78" fill="none" stroke="#701A3D" stroke-width="1"/>

  <!-- Left Identity Tag -->
  <g transform="translate(48, 50)">
    <circle cx="0" cy="-4" r="3.5" fill="#C77B9B">
      <animate attributeName="fill-opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="14" y="0" fill="#F8F0F3" class="tng-mono" font-size="11" font-weight="600" letter-spacing="1.5">
      THIMMAPUR NAGATEJA GOUD
    </text>
    <text x="210" y="0" fill="#C77B9B" class="tng-mono" font-size="10" letter-spacing="1">
      // VERIFIED PROFILE
    </text>
  </g>

  <!-- Center Node -->
  <g transform="translate(480, 45)">
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#190B12" stroke="#C77B9B" stroke-width="1.2">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="2.5" fill="#E5B5C7"/>
  </g>

  <!-- Right Telemetry -->
  <g transform="translate(912, 50)">
    <text x="0" y="0" fill="#E5B5C7" class="tng-mono" font-size="10" font-weight="500" letter-spacing="1.2" text-anchor="end">
      ENGINEERED WITH BURGUNDY VISUAL ARCHITECTURE • 2026
    </text>
  </g>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="959" height="89" rx="9.5" fill="none" stroke="#451126" stroke-width="1"/>
</svg>
